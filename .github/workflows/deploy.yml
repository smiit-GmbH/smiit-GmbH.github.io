name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The full CI suite must pass before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  build-deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      # NEXT_PUBLIC_* values are inlined into the public JS bundle, so they are not secret.
      NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
      NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_DE: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_DE }}
      NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_EN: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID_EN }}
      NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
      NEXT_PUBLIC_CALENDLY_URL_DE: ${{ secrets.NEXT_PUBLIC_CALENDLY_URL_DE }}
      NEXT_PUBLIC_CALENDLY_URL_EN: ${{ secrets.NEXT_PUBLIC_CALENDLY_URL_EN }}
      NEXT_PUBLIC_CALENDLY_URL: ${{ secrets.NEXT_PUBLIC_CALENDLY_URL }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add .nojekyll (allow _next assets)
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
